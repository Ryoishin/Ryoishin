    <text x="104" y="174" fill="#f8fafc" font-size="46" font-weight="700" letter-spacing="-1">Shivansh Raghuvanshi</text>
    <text x="106" y="216" fill="#cbd5e1" font-size="20" font-weight="400">Building Intelligent Solutions Through Code,</text>
    <text x="106" y="246" fill="#cbd5e1" font-size="20" font-weight="400">Creativity &amp; Technology.</text>
    <rect x="106" y="270" width="344" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35" />
    <text x="124" y="291" fill="#c4b5fd" font-size="12" font-weight="600" letter-spacing="1.5">PYTHON  /  BACKEND  /  AI &amp; AUTOMATION</text>
